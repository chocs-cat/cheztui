name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    # Decides whether lint, test and package run. The path filter lives here,
    # not in a workflow-level paths-ignore: a skipped workflow never reports
    # CI passed, so a pull request it skips would wait on it forever.
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Paths nothing in the gate or the build reads, as an extended
          # regex: a pull request that touches only these skips the checks.
          # README.md, LICENSE and CHANGELOG.md go into the sdist and
          # skills/ into test_skill.py, so they run; so does this workflow.
          SKIP: '^(docs/|AGENTS\.md$|CLAUDE\.md$|CONTRIBUTING\.md$|\.agents/|\.github/dependabot\.yml$|\.github/workflows/(release|formula)\.yml$)'
        run: |
          if [ -z "$PR" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both sides of a rename count, so moving code into docs/ still runs.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE "$SKIP" <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (ruff, ty)
    needs: changes
    # Anything but an explicit `false` runs it, so a failed `changes` job
    # still runs the checks instead of skipping them.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    env:
      # The floor chezmoi (DEC-21, DEC-24): raise it with MIN_VERSION.
      CHEZMOI_VERSION: 2.60.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "v$CHEZMOI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: chezmoi --version
      - run: uv sync --locked
      - run: uv run pytest -q -rs

  package:
    # Build the sdist and wheel, then install each into a fresh environment
    # and run the installed command: catches packaging mistakes (a module
    # left out of the wheel, a dependency missing from the metadata) that
    # the tests, which run from the source tree, can't see.
    name: package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel and the sdist
        run: |
          set -euo pipefail
          for dist in dist/*.whl dist/*.tar.gz; do
            env="$RUNNER_TEMP/venv-$(basename "$dist")"
            uv venv -q "$env"
            uv pip install -q --python "$env" "$dist"
            test "$("$env/bin/cheztui" --version)" = "cheztui $(uv version --short)"
            "$env/bin/cheztui" < /dev/null | grep -q chezmoi
            "$env/bin/python" -c "import cheztui.tui.app"
          done

  ok:
    # The one check branch protection requires, so the matrix can change
    # without editing the protection rule.
    name: CI passed
    if: always()
    needs: [changes, lint, test, package]
    runs-on: ubuntu-latest
    steps:
      # A pull request `changes` skips counts as passing;
      # anything else needs them all to succeed.
      - run: |
          want=success
          if [ "${{ needs.changes.outputs.code }}" = false ]; then
            want=skipped
          fi
          test "${{ needs.lint.result }}" = "$want"
          test "${{ needs.test.result }}" = "$want"
          test "${{ needs.package.result }}" = "$want"

  commits:
    name: conventional commit titles
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The action reads the pull request through the API, which the default
    # token can't do without this.
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
